<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<link rel="stylesheet" href="/widget.css">
</head>
<body>

<button id="fab" type="button" hidden>
  <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 6.5A3.5 3.5 0 0 1 7.5 3h9A3.5 3.5 0 0 1 20 6.5v6a3.5 3.5 0 0 1-3.5 3.5H10l-4.4 3.7A1 1 0 0 1 4 18.9V6.5Z" fill="currentColor"/>
  </svg>
  <span id="badge" hidden></span>
</button>

<div id="panel" class="panel" hidden>
  <header id="hdr">
    <span id="hdrAvatar" class="avatar" hidden aria-hidden="true"></span>
    <div class="brand">
      <strong id="hdrTitle"></strong>
      <small id="hdrSub"></small>
    </div>
    <div class="actions">
      <div class="menu-wrap">
        <button id="moreBtn" type="button" class="hbtn" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </button>
        <div id="moreMenu" role="menu" aria-labelledby="moreBtn" hidden>
          <button id="newBtn" type="button" class="menu-item" role="menuitem"></button>
          <button id="soundBtn" type="button" class="menu-item" role="menuitem"></button>
        </div>
      </div>
      <button id="minimize" type="button" class="hbtn" hidden>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <p id="notice" role="status" hidden></p>

  <div id="start">
    <div class="welcome" id="welcome"></div>
    <textarea id="first" rows="3" maxlength="4000"></textarea>
    <button class="primary" id="startBtn" type="button"></button>
    <p id="startError" role="alert" hidden></p>
  </div>

  <div id="chat" hidden>
    <div id="messages" role="log" aria-live="polite"></div>
    <div class="composer">
      <input id="input" autocomplete="off" enterkeyhint="send" maxlength="4000">
      <button class="primary" id="send" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="/widget.js"></script>
</body>
</html>
